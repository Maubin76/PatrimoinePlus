# Intégration continue : à chaque push (toutes branches) et sur chaque pull request,
# lance tous les tests JVM puis construit l'APK debug. Les rapports de tests sont
# joints à l'exécution en cas d'échec.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Lancer les tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Construire l'APK debug
        run: ./gradlew :app:assembleDebug

      - name: Joindre les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
