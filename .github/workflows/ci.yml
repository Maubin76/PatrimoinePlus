# Intégration continue : à chaque push sur main (seulement), lance tous les tests
# JVM (module commun et appli Android) puis construit l'APK debug. Les rapports de tests sont joints à l'exécution
# en cas d'échec. Les branches de travail ne la déclenchent pas ; elle reste
# lançable à la main depuis l'onglet Actions (workflow_dispatch).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Lancer les tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Construire l'APK debug
        run: ./gradlew :app:assembleDebug

      - name: Joindre les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
